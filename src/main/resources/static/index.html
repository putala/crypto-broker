<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Broker - Terminal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .full-height-card { min-height: 700px; background-color: #1e1e1e; border: 1px solid #333; border-radius: 15px; display: flex; flex-direction: column; }
        .ticker-card { background: rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #ffc107; transition: all 0.3s ease; }
        .form-control, .form-select { background-color: #2a2a2a !important; color: white !important; border: 1px solid #444; padding: 12px; }
        .price-text { color: #00ff88; font-weight: bold; font-size: 1.2rem; }
        .symbol-badge { color: #ffc107; font-weight: bold; font-size: 1.1rem; }
        .nav-header { background: #1a1a1a; padding: 15px; border-bottom: 2px solid #ffc107; margin-bottom: 30px; }
    </style>
</head>
<body class="py-0">

<nav class="nav-header shadow-lg">
    <div class="container d-flex justify-content-between align-items-center">
        <h4 class="text-warning mb-0 fw-bold">CRYPTO TERMINAL</h4>
        <div class="d-flex align-items-center">
            <div class="me-4 text-end">
                <small class="text-muted d-block">SALDO USD</small>
                <span id="wallet-usd-header" class="fw-bold text-success fs-5">$0.00</span>
            </div>
            <a href="wallet.html" class="btn btn-warning fw-bold">MOJE ZASOBY</a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="full-height-card p-4 shadow-lg">
                <h3 class="text-warning mb-4 fw-bold border-bottom pb-2">Rynek Live</h3>
                <div id="ticker-container"></div>
                <div class="mt-3 pt-3 border-top text-center text-muted">
                    <small id="last-update">Pobieranie...</small>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="full-height-card p-5 shadow-lg">
                <h2 class="text-center mb-5 text-warning fw-bold">Nowe Zlecenie Krypto</h2>
                <form id="orderForm" class="flex-grow-1">
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold">Instrument</label>
                            <select id="cryptoId" class="form-select" required>
                                <option value="bitcoin">Bitcoin (BTC)</option>
                                <option value="ethereum">Ethereum (ETH)</option>
                                <option value="binancecoin">Binance Coin (BNB)</option>
                                <option value="solana">Solana (SOL)</option>
                                <option value="cardano">Cardano (ADA)</option>
                                <option value="polkadot">Polkadot (DOT)</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-4">
                            <label class="form-label fw-bold">Typ operacji</label>
                            <select id="type" class="form-select">
                                <option value="BUY">KUPNO (Buy)</option>
                                <option value="SELL">SPRZEDAŻ (Sell)</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Rodzaj zlecenia</label>
                            <select id="orderStrategy" class="form-select">
                                <option value="LIMIT" selected>LIMIT</option>
                                <option value="PROGRES">PROGRES</option>
                                <option value="PKC">PKC</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Poziom klienta (Tier)</label>
                            <select id="clientTier" class="form-select">
                                <option value="None" selected>Brak</option>
                                <option value="BRONZE">BRONZE</option>
                                <option value="GOLD">GOLD</option>
                                <option value="VIP">VIP</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Cena limit (USD)</label>
                            <input type="number" step="0.01" id="targetPrice" class="form-control" placeholder="np. 70000" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Ilość jednostek</label>
                            <input type="number" step="0.0001" id="amount" class="form-control" placeholder="np. 0.5" required>
                        </div>
                    </div>
                    <div class="row mb-5">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Ważne od</label>
                            <input type="datetime-local" id="startDate" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Ważne do (Wygasa)</label>
                            <input type="datetime-local" id="expiryDate" class="form-control" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold shadow-lg py-3">URUCHOM PROCES TRANSAKCYJNY</button>
                </form>
                <div id="response" class="mt-4 text-center fw-bold"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const cryptoList = ['bitcoin', 'ethereum', 'binancecoin', 'solana', 'cardano', 'polkadot'];
    const symbolsMap = { 'bitcoin': 'BTC', 'ethereum': 'ETH', 'binancecoin': 'BNB', 'solana': 'SOL', 'cardano': 'ADA', 'polkadot': 'DOT' };
    const staticPrices = { 'ethereum': 2267.70, 'binancecoin': 759.94, 'solana': 98.94, 'cardano': 0.297, 'polkadot': 1.52 };
    let currentBtcPrice = 76394.00;

    // Portfel logic
    const initialWallet = { usd: 100000, bitcoin: 0, ethereum: 0, binancecoin: 0, solana: 0, cardano: 0, polkadot: 0 };
    function getWallet() { return JSON.parse(localStorage.getItem('crypto_broker_wallet')) || initialWallet; }
    function saveWallet(wallet) { localStorage.setItem('crypto_broker_wallet', JSON.stringify(wallet)); updateHeader(); }
    function updateHeader() { document.getElementById('wallet-usd-header').innerText = `$${getWallet().usd.toLocaleString(undefined, {minimumFractionDigits: 2})}`; }

    // Market logic
    async function initTickers() {
        try {
            const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd`);
            if (res.ok) { const data = await res.json(); if (data.bitcoin) currentBtcPrice = data.bitcoin.usd; }
        } catch (err) { console.error("API error"); }
        const container = document.getElementById('ticker-container');
        container.innerHTML = '';
        cryptoList.forEach(id => {
            const price = (id === 'bitcoin') ? currentBtcPrice : staticPrices[id];
            container.innerHTML += `<div class="ticker-card d-flex justify-content-between align-items-center">
                <div><span class="symbol-badge">${symbolsMap[id]}</span></div>
                <div class="text-end"><span class="price-text">$${price.toLocaleString(undefined, {minimumFractionDigits: 2})}</span></div>
            </div>`;
        });
        document.getElementById('last-update').innerText = `Pobrano: ${new Date().toLocaleTimeString()}`;
    }

    // PKC UI
    document.getElementById('orderStrategy').addEventListener('change', function() {
        const isPKC = this.value === 'PKC';
        document.getElementById('targetPrice').disabled = isPKC;
        if (isPKC) document.getElementById('targetPrice').required = false;
    });

    // Form Submit
    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const wallet = getWallet();
        const cryptoId = document.getElementById('cryptoId').value;
        const type = document.getElementById('type').value;
        const amount = parseFloat(document.getElementById('amount').value);
        const strategy = document.getElementById('orderStrategy').value;
        const priceToUse = strategy === 'PKC' ? (cryptoId === 'bitcoin' ? currentBtcPrice : staticPrices[cryptoId]) : parseFloat(document.getElementById('targetPrice').value);
        const totalCost = priceToUse * amount;

        if (type === 'BUY' && wallet.usd < totalCost) { alert("Niewystarczające środki USD!"); return; }
        if (type === 'SELL' && wallet[cryptoId] < amount) { alert("Niewystarczająca ilość krypto!"); return; }

        try {
            const response = await fetch('/api/orders/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ cryptoId, type, orderStrategy: strategy, clientTier: document.getElementById('clientTier').value, targetPrice: priceToUse, amount, startDate: new Date(document.getElementById('startDate').value).toISOString(), expiryDate: new Date(document.getElementById('expiryDate').value).toISOString() })
            });

            if (response.ok) {
                if (type === 'BUY') { wallet.usd -= totalCost; wallet[cryptoId] += amount; }
                else { wallet.usd += totalCost; wallet[cryptoId] -= amount; }
                saveWallet(wallet);
                document.getElementById('response').innerHTML = `<div class="p-3 border border-success text-success">✅ Zlecenie procesowane pomyślnie!</div>`;
            }
        } catch (error) { document.getElementById('response').innerText = '❌ Błąd serwera'; }
    };

    initTickers();
    updateHeader();
    const nowLocal = new Date(new Date().getTime() - new Date().getTimezoneOffset() * 60000);
    document.getElementById('startDate').value = nowLocal.toISOString().slice(0, 16);
    document.getElementById('expiryDate').value = new Date(nowLocal.getTime() + 3600000).toISOString().slice(0, 16);
</script>
</body>
</html>
