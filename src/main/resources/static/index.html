<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Broker UI - Terminal v2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .full-height-card { min-height: 700px; background-color: #1e1e1e; border: 1px solid #333; border-radius: 15px; display: flex; flex-direction: column; }
        .ticker-card { background: rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #ffc107; transition: all 0.3s ease; }
        .ticker-card:hover { transform: translateX(5px); background: rgba(255, 255, 255, 0.1); }
        .form-control, .form-select { background-color: #2a2a2a !important; color: white !important; border: 1px solid #444; padding: 12px; }
        .form-control:focus, .form-select:focus { border-color: #ffc107; box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25); }
        .form-control:disabled { background-color: #1a1a1a !important; color: #666 !important; border-color: #222; cursor: not-allowed; }
        #ticker-container { flex-grow: 1; overflow-y: auto; padding-right: 5px; }
        .btn-warning { padding: 15px; font-size: 1.1rem; transition: all 0.3s; }
        .btn-warning:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3); }
        .price-text { color: #00ff88; font-weight: bold; font-size: 1.2rem; }
        .spread-label { color: #888; font-size: 0.85rem; }
        .symbol-badge { color: #ffc107; font-weight: bold; font-size: 1.1rem; }
        #ticker-container::-webkit-scrollbar { width: 5px; }
        #ticker-container::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body class="container py-4">
<div class="row g-4">
    <div class="col-md-4">
        <div class="full-height-card p-4 shadow-lg">
            <h3 class="text-warning mb-4 fw-bold border-bottom pb-2">Rynek Live</h3>
            <div id="ticker-container">
                <div class="text-center py-5">
                    <div class="spinner-border text-warning" role="status"></div>
                    <p class="mt-2 text-muted">Łączenie z giełdą...</p>
                </div>
            </div>
            <div class="mt-3 pt-3 border-top text-center text-muted">
                <small id="last-update">Aktualizacja: Przy starcie strony</small>
            </div>
        </div>
    </div>

    <div class="col-md-8">
        <div class="full-height-card p-5 shadow-lg">
            <h2 class="text-center mb-5 text-warning fw-bold">Nowe Zlecenie Krypto</h2>
            <form id="orderForm" class="flex-grow-1">
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">Instrument</label>
                        <select id="cryptoId" class="form-select" required>
                            <option value="bitcoin">Bitcoin (BTC)</option>
                            <option value="ethereum">Ethereum (ETH)</option>
                            <option value="binancecoin">Binance Coin (BNB)</option>
                            <option value="solana">Solana (SOL)</option>
                            <option value="cardano">Cardano (ADA)</option>
                            <option value="polkadot">Polkadot (DOT)</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label class="form-label fw-bold">Typ operacji</label>
                        <select id="type" class="form-select">
                            <option value="BUY">KUPNO (Buy)</option>
                            <option value="SELL">SPRZEDAŻ (Sell)</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Rodzaj zlecenia</label>
                        <select id="orderStrategy" class="form-select">
                            <option value="LIMIT" selected>LIMIT</option>
                            <option value="PROGRES">PROGRES</option>
                            <option value="PKC">PKC</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Poziom klienta (Tier)</label>
                        <select id="clientTier" class="form-select">
                            <option value="None" selected>Brak</option>
                            <option value="BRONZE">BRONZE</option>
                            <option value="GOLD">GOLD</option>
                            <option value="VIP">VIP</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Cena limit (USD)</label>
                        <input type="number" step="0.01" id="targetPrice" class="form-control" placeholder="np. 70000" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Ilość jednostek</label>
                        <input type="number" step="0.0001" id="amount" class="form-control" placeholder="np. 0.5" required>
                    </div>
                </div>

                <div class="row mb-5">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Ważne od</label>
                        <input type="datetime-local" id="startDate" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Ważne do (Wygasa)</label>
                        <input type="datetime-local" id="expiryDate" class="form-control" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-warning w-100 fw-bold shadow-lg">URUCHOM PROCES TRANSAKCYJNY</button>
            </form>
            <div id="response" class="mt-4 text-center fw-bold"></div>
        </div>
    </div>
</div>

<script>
    const cryptoList = ['bitcoin', 'ethereum', 'binancecoin', 'solana', 'cardano', 'polkadot'];
    const symbolsMap = {
        'bitcoin': 'BTC', 'ethereum': 'ETH', 'binancecoin': 'BNB', 'solana': 'SOL', 'cardano': 'ADA', 'polkadot': 'DOT'
    };

    const staticPrices = {
        'ethereum': 2267.70, 'binancecoin': 759.94, 'solana': 98.94, 'cardano': 0.297, 'polkadot': 1.52
    };

    // UI Logic for PKC
    const orderStrategySelect = document.getElementById('orderStrategy');
    const targetPriceInput = document.getElementById('targetPrice');

    orderStrategySelect.addEventListener('change', function() {
        if (this.value === 'PKC') {
            targetPriceInput.disabled = true;
            targetPriceInput.value = '';
            targetPriceInput.required = false;
            targetPriceInput.placeholder = 'Niedostępne dla PKC';
        } else {
            targetPriceInput.disabled = false;
            targetPriceInput.required = true;
            targetPriceInput.placeholder = 'np. 70000';
        }
    });

    // POZYSKANIE KURSU TYLKO RAZ PRZY STARTU
    async function initTickers() {
        let btcPrice = 76394.00;

        try {
            const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd`);
            if (res.ok) {
                const data = await res.json();
                if (data.bitcoin) btcPrice = data.bitcoin.usd;
            }
        } catch (err) {
            console.error("Błąd API, używam ceny domyślnej");
        }

        const container = document.getElementById('ticker-container');
        container.innerHTML = '';

        cryptoList.forEach(id => {
            const price = (id === 'bitcoin') ? btcPrice : staticPrices[id];
            const spread = (0.5 + (Math.random() * 2.0)).toFixed(2);

            container.innerHTML += `
                <div class="ticker-card d-flex justify-content-between align-items-center">
                    <div>
                        <span class="symbol-badge">${symbolsMap[id]}</span><br>
                        <span class="spread-label">Spread: ${spread}%</span>
                    </div>
                    <div class="text-end">
                        <span class="price-text">$${price.toLocaleString(undefined, {minimumFractionDigits: 2})}</span>
                    </div>
                </div>`;
        });
        document.getElementById('last-update').innerText = `Pobrano przy starcie: ${new Date().toLocaleTimeString()}`;
    }

    initTickers();

    // POPRAWKA DOMYŚLNYCH DAT: Uwzględnienie strefy czasowej lokalnej
    const now = new Date();
    const tzOffset = now.getTimezoneOffset() * 60000; // Offset w ms

    // Data "Ważne od" ustawiona na teraz (czas lokalny)
    const localNow = new Date(now.getTime() - tzOffset);
    document.getElementById('startDate').value = localNow.toISOString().slice(0, 16);

    // Data "Ważne do" ustawiona na teraz + 1 godzina (czas lokalny)
    const localExpiry = new Date(now.getTime() - tzOffset + (3600000));
    document.getElementById('expiryDate').value = localExpiry.toISOString().slice(0, 16);

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const responseDiv = document.getElementById('response');
        const tPrice = document.getElementById('targetPrice').value;

        const data = {
            cryptoId: document.getElementById('cryptoId').value,
            type: document.getElementById('type').value,
            orderStrategy: document.getElementById('orderStrategy').value,
            clientTier: document.getElementById('clientTier').value,
            targetPrice: tPrice ? parseFloat(tPrice) : 0,
            amount: parseFloat(document.getElementById('amount').value),
            startDate: new Date(document.getElementById('startDate').value).toISOString(),
            expiryDate: new Date(document.getElementById('expiryDate').value).toISOString()
        };

        try {
            const response = await fetch('/api/orders/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const resultText = await response.text();
            responseDiv.style.display = 'block';
            responseDiv.className = response.ok ? 'mt-4 text-center fw-bold text-success border border-success p-3' : 'mt-4 text-center fw-bold text-danger border border-danger p-3';
            responseDiv.innerText = (response.ok ? '✅ Zlecenie wysłane: ' : '❌ Błąd: ') + resultText;
        } catch (error) {
            responseDiv.style.display = 'block';
            responseDiv.innerText = '❌ Brak połączenia z serwerem Java';
        }
    };
</script>
</body>
</html>
